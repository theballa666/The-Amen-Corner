<script>
  const iconPool = [
    { normal: "./img/christophfavicon.png", hover: "./img/christoph_shockedfavicon.png", alt: "Christoph icon" },
    { normal: "./img/opalfavicon.png", hover: "./img/opalsmilefavicon.png", alt: "Opal icon" },
    { normal: "./img/faolanfavicon.png", hover: "./img/faolan_winkfavicon.png", alt: "Faolán icon" }
    // add more characters here as you create their icons
];

function applyIcon(imgId, character) {
    const img = document.getElementById(imgId);
    img.src = character.normal;
    img.alt = character.alt;
    img.onmouseover = () => { img.src = character.hover; };
    img.onmouseout = () => { img.src = character.normal; };
}

const shuffled = [...iconPool].sort(() => Math.random() - 0.5);
applyIcon("titleIconLeft", shuffled[0]);
applyIcon("titleIconRight", shuffled[1]);
</script>
