<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Amen Corner | WiPs</title>

    <!-- Widget functionality -->
    <script src="https://u.widget.st/ar.js"></script>

    <!-- style -->
    <link href="css/style.css" rel="stylesheet" type="text/css" media="all">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <!-- Cherry Cream Soda -->
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&display=swap" rel="stylesheet">
    <!-- Open Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="img/opalfavicon.png" />
</head>

<body align="center">

    <!-- header -->
    <div class="writeHeader"></div>

    <div class="subPage clearfix" align="center">
        <div class="archiveTitleRow">
            <div class="archiveTitleRow">
                <a id="linkIconLeft" href="#"><img id="titleIconLeft" class="title-icon" alt="Character icon"
                        style="width:50px;height:50px;" /></a>
                <h1>Gallery</h1>
                <a id="linkIconRight" href="#"><img id="titleIconRight" class="title-icon" alt="Character icon"
                        style="width:50px;height:50px;" /></a>
            </div>
        </div>

        <!-- MAIN SECTION -->
        <section class="wipSection">
            <h2 class="charSectionHeading">Main</h2>
            <p>Completed one-off works.</p>
            <div class="galleryGrid">
                <!-- copy this block for each item:
                <div class="galleryItem">
                    <img src="img/misc/example.png" alt="Example" />
                    <h5>Title</h5>
                    <p>Short caption/subtitle.</p>
                </div>
                -->
            </div>
        </section>

        <!-- WIP SECTION -->
        <section class="wipSection">
            <h2 class="charSectionHeading">WiP</h2>
            <p>Things that aren't or won't be finished.</p>
            <div class="galleryGrid">
                <div class="galleryItem">
                    <img src="img/misc/troop.png" alt="Leona and horse" />
                    <h5>Leona</h5>
                    <p>And horse.</p>
                </div>

                <div class="galleryItem">
                    <img src="img/misc/duatigak2.png" alt="Fionn and hammer" />
                    <h5>Fionnán</h5>
                    <p>And hammer.</p>
                </div>

                <div class="galleryItem">
                    <img src="img/misc/spark.png" alt="hot hot hot" />
                    <h5>Flash Incinerate</h5>
                    <p>That's hot.</p>
                </div>
            </div>
        </section>

        <!-- OTHER SECTION -->
        <section class="wipSection">
            <h2 class="charSectionHeading">Other</h2>
            <p>Subtitle for the Other section goes here.</p>
            <div class="galleryGrid">
                <!-- copy this block for each item:
                <div class="galleryItem">
                    <img src="img/misc/example.png" alt="Example" />
                    <h5>Title</h5>
                    <p>Short caption/subtitle.</p>
                </div>
                -->
            </div>
        </section>
    </div>

    <!-- footer -->
    <div class="writeFooter"></div>

    <!-- at the end of this page we only call the header and footer scripts, because we don't need use any functions from the other scripts. -->
    <script src="js/comic_header.js" defer></script>
    <script src="js/comic_footer.js" defer></script>
</body>

</html>
